<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080711">

<title>TAILBLADE</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080711;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}

button{
  border:0;
  outline:0;
  font:inherit;
  color:inherit;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#080711;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

/* ================================
   START
================================ */

.screen{
  position:absolute;
  inset:0;
  z-index:50;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 42%,
      #28163b 0%,
      #110b1d 45%,
      #080711 82%
    );
}

.logo{
  text-align:center;
  margin-bottom:42px;
}

.logo h1{
  font-family:Georgia,serif;
  font-size:clamp(48px,10vw,108px);
  line-height:.9;
  letter-spacing:.12em;
  color:#f4e9c8;

  text-shadow:
    5px 5px 0 #3b2348,
    0 0 35px rgba(239,163,61,.18);
}

.logo p{
  margin-top:20px;
  color:#9d91b8;
  font-size:clamp(10px,1.8vw,17px);
  letter-spacing:.5em;
}

.start{
  min-width:230px;
  min-height:68px;

  padding:0 42px;

  border:2px solid #f0a63c;
  border-radius:10px;

  background:rgba(20,15,34,.8);

  color:#f4e9c8;

  font-size:19px;
  font-weight:800;
  letter-spacing:.25em;

  box-shadow:
    0 0 30px rgba(240,166,60,.12);
}

.start:active{
  transform:scale(.95);
  background:#f0a63c;
  color:#17101e;
}

.version{
  position:absolute;
  bottom:18px;
  color:#514862;
  font-size:10px;
  letter-spacing:.12em;
}

/* ================================
   HUD
================================ */

#hud{
  position:absolute;
  inset:0;
  z-index:20;
  display:none;
  pointer-events:none;
}

.topbar{
  position:absolute;
  top:max(14px,env(safe-area-inset-top));
  left:18px;
  right:18px;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.leftHud{
  width:min(300px,32vw);
}

.label{
  color:#8f839f;
  font-size:10px;
  letter-spacing:.14em;
  margin-bottom:5px;
}

.hpOuter{
  height:14px;
  border:2px solid #34283e;
  border-radius:8px;
  overflow:hidden;
  background:#100d17;
}

#hp{
  width:100%;
  height:100%;
  background:#e65e77;
  transition:width .12s;
}

.bossHp{
  display:none;
  margin-top:8px;
}

#bossHp{
  width:100%;
  height:100%;
  background:#9e4de0;
}

.rightHud{
  text-align:right;
}

.scoreLabel{
  color:#8f839f;
  font-size:10px;
  letter-spacing:.14em;
}

#score{
  color:#f4e9c8;
  font-size:23px;
  font-weight:900;
}

#combo{
  height:20px;
  color:#f0a63c;
  font-size:14px;
  font-weight:900;
}

#progress{
  color:#9d91b8;
  font-size:10px;
  letter-spacing:.12em;
}

.pause{
  pointer-events:auto;

  position:absolute;
  right:18px;
  top:max(60px,calc(env(safe-area-inset-top) + 52px));

  width:40px;
  height:40px;

  border:1px solid #51445e;
  border-radius:8px;

  background:rgba(15,12,24,.65);
  color:#f4e9c8;
}

/* ================================
   CONTROLS
================================ */

#controls{
  position:absolute;
  inset:0;
  z-index:25;
  display:none;
  pointer-events:none;
}

.ctrl{
  position:absolute;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#f4e9c8;

  background:rgba(20,15,34,.52);

  border:2px solid rgba(244,233,200,.22);

  box-shadow:
    inset 0 0 20px rgba(255,255,255,.025),
    0 5px 20px rgba(0,0,0,.25);

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  pointer-events:auto;

  touch-action:none;
}

.ctrl:active,
.ctrl.active{
  transform:scale(.88);
  background:rgba(240,166,60,.62);
  border-color:#f0a63c;
}

.move{
  bottom:max(24px,env(safe-area-inset-bottom));

  width:70px;
  height:70px;
}

#left{
  left:24px;
}

#right{
  left:103px;
}

.attack{
  width:84px;
  height:84px;

  right:24px;

  bottom:max(24px,env(safe-area-inset-bottom));

  background:rgba(119,47,69,.5);
}

.jump{
  width:70px;
  height:70px;

  right:117px;

  bottom:max(27px,env(safe-area-inset-bottom));
}

.dash{
  width:56px;
  height:56px;

  right:195px;

  bottom:max(36px,calc(env(safe-area-inset-bottom) + 10px));

  font-size:10px;
  font-weight:800;
}

.icon{
  font-size:28px;
  font-weight:900;
}

/* ================================
   OVERLAY
================================ */

.overlay{
  position:absolute;
  inset:0;
  z-index:60;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:rgba(5,4,9,.78);

  backdrop-filter:blur(6px);
}

.overlay h2{
  color:#f4e9c8;
  font-family:Georgia,serif;
  font-size:clamp(40px,8vw,80px);
  letter-spacing:.08em;
  margin-bottom:12px;
}

.overlay p{
  color:#9d91b8;
  margin-bottom:28px;
}

.retry{
  min-width:190px;
  min-height:58px;

  border:2px solid #f0a63c;
  border-radius:8px;

  background:#140f22;
  color:#f4e9c8;

  font-weight:800;
  letter-spacing:.15em;
}

.retry:active{
  transform:scale(.95);
}

/* ================================
   ROTATE
================================ */

#rotate{
  position:fixed;
  inset:0;
  z-index:200;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:#080711;
  color:#f4e9c8;
  text-align:center;
}

.rotateIcon{
  font-size:60px;
  margin-bottom:20px;
}

.rotateText{
  font-size:18px;
  font-weight:700;
}

@media (orientation:portrait) and (max-width:700px){
  #rotate{
    display:flex;
  }
}

@media(max-height:500px){
  .move{
    width:60px;
    height:60px;
  }

  #right{
    left:91px;
  }

  .attack{
    width:74px;
    height:74px;
  }

  .jump{
    width:62px;
    height:62px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas" width="960" height="540"></canvas>

<!-- ================= START ================= -->

<div id="startScreen" class="screen">

  <div class="logo">
    <h1>TAILBLADE</h1>
    <p>PIXEL ACTION ADVENTURE</p>
  </div>

  <button id="start" class="start">
    START
  </button>

  <div class="version">
    TAILBLADE // v2.0
  </div>

</div>

<!-- ================= HUD ================= -->

<div id="hud">

  <div class="topbar">

    <div class="leftHud">

      <div class="label">HP</div>

      <div class="hpOuter">
        <div id="hp"></div>
      </div>

      <div id="bossBar" class="bossHp">

        <div class="label">GUARDIAN</div>

        <div class="hpOuter">
          <div id="bossHp"></div>
        </div>

      </div>

    </div>

    <div class="rightHud">

      <div class="scoreLabel">SCORE</div>

      <div id="score">
        000000
      </div>

      <div id="combo"></div>

      <div id="progress">
        AREA 01
      </div>

    </div>

  </div>

  <button id="pause" class="pause">
    Ⅱ
  </button>

</div>

<!-- ================= CONTROLS ================= -->

<div id="controls">

  <div id="left" class="ctrl move">
    <span class="icon">◀</span>
  </div>

  <div id="right" class="ctrl move">
    <span class="icon">▶</span>
  </div>

  <div id="dash" class="ctrl dash">
    DASH
  </div>

  <div id="jump" class="ctrl jump">
    <span class="icon">▲</span>
  </div>

  <div id="attack" class="ctrl attack">
    <span class="icon">⚔</span>
  </div>

</div>

<!-- ================= GAME OVER ================= -->

<div id="gameOver" class="overlay">

  <h2>GAME OVER</h2>

  <p id="finalScore">
    SCORE 000000
  </p>

  <button id="retry" class="retry">
    RETRY
  </button>

</div>

<!-- ================= CLEAR ================= -->

<div id="clear" class="overlay">

  <h2>STAGE CLEAR</h2>

  <p id="clearScore">
    SCORE 000000
  </p>

  <button id="again" class="retry">
    PLAY AGAIN
  </button>

</div>

<!-- ================= PAUSE ================= -->

<div id="pauseScreen" class="overlay">

  <h2>PAUSED</h2>

  <p>ゲームを一時停止しています</p>

  <button id="resume" class="retry">
    RESUME
  </button>

</div>

</div>

<!-- ================= ROTATE ================= -->

<div id="rotate">

  <div class="rotateIcon">
    ↻
  </div>

  <div class="rotateText">
    スマホを横向きにしてください
  </div>

</div>

<script>
"use strict";

/* ============================================================
   TAILBLADE v2
   Mobile Pixel Action Game
============================================================ */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const WIDTH = 960;
const HEIGHT = 540;

const GROUND = 430;

/* ============================================================
   STATE
============================================================ */

let gameRunning = false;
let paused = false;

let score = 0;
let combo = 0;
let comboTimer = 0;

let worldX = 0;

let shake = 0;
let hitStop = 0;

let elapsed = 0;

let stageClear = false;

/* ============================================================
   INPUT
============================================================ */

const input = {
  left:false,
  right:false,
  jump:false,
  attack:false,
  dash:false
};

/* ============================================================
   PLAYER
============================================================ */

const player = {

  x:180,
  y:GROUND-68,

  width:42,
  height:68,

  vx:0,
  vy:0,

  speed:260,

  jumpPower:540,

  gravity:1500,

  facing:1,

  grounded:true,

  hp:100,
  maxHp:100,

  attackTimer:0,
  attackCooldown:0,

  dashTimer:0,
  dashCooldown:0,

  invincible:0,
  hurtTimer:0,

  animation:0,

  coins:0
};

/* ============================================================
   CAMERA
============================================================ */

const camera = {

  x:0,

  target:0
};

/* ============================================================
   WORLD
============================================================ */

const STAGE_LENGTH = 7200;

const platforms = [

  {x:0,y:GROUND,w:1400,h:110},

  {x:1450,y:GROUND,w:950,h:110},

  {x:2470,y:GROUND,w:1200,h:110},

  {x:3740,y:GROUND,w:1000,h:110},

  {x:4810,y:GROUND,w:1000,h:110},

  {x:5880,y:GROUND,w:1320,h:110}

];

const coins = [];

for(let i=0;i<65;i++){

  coins.push({

    x:300+i*105+Math.random()*60,

    y:GROUND-75-Math.random()*85,

    taken:false,

    phase:Math.random()*6

  });

}

/* ============================================================
   ENEMIES
============================================================ */

const enemies = [];

function spawnEnemy(x,type=0){

  enemies.push({

    x,

    y:GROUND-46,

    width:type===1?52:42,

    height:type===1?52:42,

    vx:0,

    hp:type===1?55:30,

    maxHp:type===1?55:30,

    speed:type===1?48:70,

    type,

    attackCooldown:Math.random()+.5,

    hurtTimer:0,

    flash:0,

    dead:false,

    facing:-1

  });

}

for(let x=700;x<6500;x+=500){

  spawnEnemy(
    x,
    Math.random()<.18 ? 1 : 0
  );

}

/* ============================================================
   PARTICLES
============================================================ */

const particles=[];

function burst(
  x,
  y,
  color,
  count=10
){

  for(let i=0;i<count;i++){

    particles.push({

      x,
      y,

      vx:(Math.random()-.5)*360,

      vy:(Math.random()-.8)*360,

      life:.35+Math.random()*.35,

      size:2+Math.random()*6,

      color

    });

  }

}

/* ============================================================
   FLOATING TEXT
============================================================ */

const floating=[];

function textPop(
  x,
  y,
  text,
  color="#f4e9c8"
){

  floating.push({

    x,
    y,

    text,

    color,

    life:.75

  });

}

/* ============================================================
   RESET
============================================================ */

function resetGame(){

  score=0;
  combo=0;
  comboTimer=0;

  worldX=0;

  shake=0;
  hitStop=0;

  elapsed=0;

  stageClear=false;

  player.x=180;
  player.y=GROUND-player.height;

  player.vx=0;
  player.vy=0;

  player.hp=100;

  player.facing=1;

  player.grounded=true;

  player.attackTimer=0;
  player.attackCooldown=0;

  player.dashTimer=0;
  player.dashCooldown=0;

  player.invincible=0;
  player.hurtTimer=0;

  player.coins=0;

  camera.x=0;

  particles.length=0;
  floating.length=0;

  enemies.length=0;

  for(let x=700;x<6500;x+=500){

    spawnEnemy(
      x,
      Math.random()<.18 ? 1 : 0
    );

  }

  for(const c of coins){
    c.taken=false;
  }

  updateHUD();

}

/* ============================================================
   START
============================================================ */

function startGame(){

  resetGame();

  gameRunning=true;
  paused=false;

  document
    .getElementById("startScreen")
    .style.display="none";

  document
    .getElementById("gameOver")
    .style.display="none";

  document
    .getElementById("clear")
    .style.display="none";

  document
    .getElementById("pauseScreen")
    .style.display="none";

  document
    .getElementById("hud")
    .style.display="block";

  document
    .getElementById("controls")
    .style.display="block";

  lastTime=performance.now();

  requestAnimationFrame(loop);

}

/* ============================================================
   GAME OVER
============================================================ */

function gameOver(){

  gameRunning=false;

  document
    .getElementById("controls")
    .style.display="none";

  document
    .getElementById("gameOver")
    .style.display="flex";

  document
    .getElementById("finalScore")
    .textContent=
      "SCORE "+String(score).padStart(6,"0");

}

/* ============================================================
   CLEAR
============================================================ */

function clearGame(){

  gameRunning=false;
  stageClear=true;

  score+=5000;

  document
    .getElementById("controls")
    .style.display="none";

  document
    .getElementById("clear")
    .style.display="flex";

  document
    .getElementById("clearScore")
    .textContent=
      "SCORE "+String(score).padStart(6,"0");

}

/* ============================================================
   PLAYER UPDATE
============================================================ */

function updatePlayer(dt){

  player.invincible=
    Math.max(0,player.invincible-dt);

  player.attackCooldown=
    Math.max(0,player.attackCooldown-dt);

  player.dashCooldown=
    Math.max(0,player.dashCooldown-dt);

  player.attackTimer=
    Math.max(0,player.attackTimer-dt);

  player.hurtTimer=
    Math.max(0,player.hurtTimer-dt);

  /* movement */

  let dir=0;

  if(input.left) dir--;
  if(input.right) dir++;

  if(dir!==0){

    player.vx +=
      (dir*player.speed-player.vx)
      *Math.min(1,12*dt);

    player.facing=dir;

  }else{

    player.vx +=
      (0-player.vx)
      *Math.min(1,15*dt);

  }

  /* dash */

  if(
    input.dash &&
    player.dashCooldown<=0
  ){

    player.dashCooldown=.9;

    player.dashTimer=.18;

    player.invincible=.22;

    player.vx=
      player.facing*760;

    burst(
      player.x+player.width/2,
      player.y+player.height/2,
      "#f0a63c",
      18
    );

  }

  if(player.dashTimer>0){

    player.dashTimer-=dt;

    player.vx=
      player.facing*760;

  }

  /* jump */

  if(
    input.jump &&
    player.grounded
  ){

    player.vy=
      -player.jumpPower;

    player.grounded=false;

    burst(
      player.x+player.width/2,
      GROUND,
      "#c7a9d7",
      8
    );

  }

  /* gravity */

  player.vy+=
    player.gravity*dt;

  player.x+=
    player.vx*dt;

  player.y+=
    player.vy*dt;

  /* ground */

  if(player.y+player.height>=GROUND){

    player.y=
      GROUND-player.height;

    player.vy=0;

    player.grounded=true;

  }

  /* boundaries */

  player.x=
    Math.max(
      20,
      Math.min(
        STAGE_LENGTH-player.width-30,
        player.x
      )
    );

  /* attack */

  if(
    input.attack &&
    player.attackCooldown<=0
  ){

    performAttack();

  }

  player.animation+=dt*10;

}

/* ============================================================
   ATTACK
============================================================ */

function performAttack(){

  player.attackCooldown=.32;

  player.attackTimer=.22;

  const range=90;

  const hitbox={

    x:
      player.facing>0
      ?player.x+player.width
      :player.x-range,

    y:player.y+10,

    width:range,

    height:48

  };

  let connected=false;

  for(const enemy of enemies){

    if(enemy.dead) continue;

    const box={

      x:enemy.x,

      y:enemy.y,

      width:enemy.width,

      height:enemy.height

    };

    if(
      hitbox.x < box.x+box.width &&
      hitbox.x+hitbox.width > box.x &&
      hitbox.y < box.y+box.height &&
      hitbox.y+hitbox.height > box.y
    ){

      connected=true;

      const damage=
        enemy.type===1 ? 16 : 18;

      enemy.hp-=damage;

      enemy.hurtTimer=.2;

      enemy.flash=.12;

      enemy.vx=
        player.facing*330;

      combo++;

      comboTimer=1.25;

      score+=
        100*Math.max(1,combo);

      burst(
        enemy.x+enemy.width/2,
        enemy.y+enemy.height/2,
        "#f0a63c",
        16
      );

      textPop(
        enemy.x+enemy.width/2,
        enemy.y-12,
        "HIT!",
        "#f0a63c"
      );

      shake=.10;

      hitStop=.045;

      if(enemy.hp<=0){

        enemy.dead=true;

        score+=500;

        burst(
          enemy.x+enemy.width/2,
          enemy.y+enemy.height/2,
          "#f4e9c8",
          25
        );

        textPop(
          enemy.x+enemy.width/2,
          enemy.y-22,
          "DEFEATED",
          "#f0a63c"
        );

      }

    }

  }

  if(connected){

    player.vx-=
      player.facing*30;

  }

}

/* ============================================================
   ENEMY UPDATE
============================================================ */

function updateEnemies(dt){

  for(const enemy of enemies){

    if(enemy.dead) continue;

    enemy.attackCooldown=
      Math.max(
        0,
        enemy.attackCooldown-dt
      );

    enemy.hurtTimer=
      Math.max(
        0,
        enemy.hurtTimer-dt
      );

    enemy.flash=
      Math.max(
        0,
        enemy.flash-dt
      );

    const dx=
      player.x-enemy.x;

    const distance=
      Math.abs(dx);

    if(enemy.hurtTimer<=0){

      if(distance>58){

        enemy.vx=
          Math.sign(dx)*enemy.speed;

        enemy.facing=
          Math.sign(dx);

      }else{

        enemy.vx=0;

        if(
          enemy.attackCooldown<=0
        ){

          enemy.attackCooldown=1.2;

          damagePlayer(
            enemy.type===1?12:8
          );

        }

      }

    }else{

      enemy.vx*=.9;

    }

    enemy.x+=
      enemy.vx*dt;

  }

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    if(enemies[i].dead){

      enemies.splice(i,1);

    }

  }

}

/* ============================================================
   DAMAGE
============================================================ */

function damagePlayer(amount){

  if(player.invincible>0) return;

  player.hp-=amount;

  player.invincible=.7;

  player.hurtTimer=.25;

  player.vx=
    player.facing*-180;

  shake=.18;

  hitStop=.08;

  combo=0;
  comboTimer=0;

  burst(
    player.x+player.width/2,
    player.y+player.height/2,
    "#e65e77",
    16
  );

  textPop(
    player.x+player.width/2,
    player.y-10,
    "-"+amount,
    "#e65e77"
  );

  if(player.hp<=0){

    player.hp=0;

    gameOver();

  }

}

/* ============================================================
   COINS
============================================================ */

function updateCoins(){

  for(const coin of coins){

    if(coin.taken) continue;

    const dx=
      Math.abs(
        player.x+player.width/2-coin.x
      );

    const dy=
      Math.abs(
        player.y+player.height/2-coin.y
      );

    if(dx<32 && dy<45){

      coin.taken=true;

      player.coins++;

      score+=250;

      burst(
        coin.x,
        coin.y,
        "#f4c85d",
        10
      );

      textPop(
        coin.x,
        coin.y-15,
        "+250",
        "#f4c85d"
      );

    }

  }

}

/* ============================================================
   PARTICLES UPDATE
============================================================ */

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.life-=dt;

    p.vy+=700*dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    if(p.life<=0){

      particles.splice(i,1);

    }

  }

}

function updateFloating(dt){

  for(
    let i=floating.length-1;
    i>=0;
    i--
  ){

    const t=floating[i];

    t.life-=dt;

    t.y-=35*dt;

    if(t.life<=0){

      floating.splice(i,1);

    }

  }

}

/* ============================================================
   CAMERA
============================================================ */

function updateCamera(dt){

  camera.target=
    player.x-WIDTH*.38;

  camera.target=
    Math.max(
      0,
      Math.min(
        STAGE_LENGTH-WIDTH,
        camera.target
      )
    );

  camera.x+=
    (camera.target-camera.x)
    *Math.min(1,6*dt);

  worldX=camera.x;

}

/* ============================================================
   UPDATE
============================================================ */

function update(dt){

  elapsed+=dt;

  if(comboTimer>0){

    comboTimer-=dt;

    if(comboTimer<=0){

      combo=0;

    }

  }

  updatePlayer(dt);
  updateEnemies(dt);
  updateCoins();

  updateParticles(dt);
  updateFloating(dt);

  updateCamera(dt);

  /* clear */

  if(player.x>STAGE_LENGTH-180){

    clearGame();

  }

  updateHUD();

}

/* ============================================================
   BACKGROUND
============================================================ */

function drawBackground(){

  /* sky */

  const sky=
    ctx.createLinearGradient(
      0,0,
      0,HEIGHT
    );

  sky.addColorStop(0,"#070714");
  sky.addColorStop(.5,"#15122a");
  sky.addColorStop(1,"#332037");

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,
    WIDTH,
    HEIGHT
  );

  /* moon */

  ctx.fillStyle="#f4e9c8";

  ctx.globalAlpha=.10;

  ctx.beginPath();

  ctx.arc(
    760-worldX*.05,
    115,
    62,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;

  /* stars */

  for(let i=0;i<65;i++){

    const x=
      ((i*173)-worldX*.08)%WIDTH;

    const fixedX=
      x<0?x+WIDTH:x;

    const y=
      (i*71)%270;

    ctx.globalAlpha=
      .25+
      .25*Math.sin(
        elapsed*2+i
      );

    ctx.fillStyle="#f4e9c8";

    ctx.fillRect(
      fixedX,
      y,
      2,
      2
    );

  }

  ctx.globalAlpha=1;

  /* distant city */

  drawCity(.12,"#0e0c1b",90);
  drawCity(.22,"#121024",130);
  drawCity(.35,"#181329",165);

}

function drawCity(speed,color,height){

  ctx.fillStyle=color;

  const offset=
    -(worldX*speed)%100;

  for(
    let x=offset-100;
    x<WIDTH+100;
    x+=100
  ){

    const h=
      height+
      ((Math.floor(x)+1000)%70);

    ctx.fillRect(
      x,
      GROUND-h,
      78,
      h
    );

    /* windows */

    ctx.fillStyle="#49364c";

    for(
      let wy=GROUND-h+18;
      wy<GROUND-10;
      wy+=25
    ){

      ctx.fillRect(
        x+15,
        wy,
        5,
        8
      );

      ctx.fillRect(
        x+45,
        wy,
        5,
        8
      );

    }

    ctx.fillStyle=color;

  }

}

/* ============================================================
   GROUND
============================================================ */

function drawGround(){

  ctx.fillStyle="#24162b";

  ctx.fillRect(
    0,
    GROUND,
    WIDTH,
    HEIGHT-GROUND
  );

  ctx.fillStyle="#513044";

  ctx.fillRect(
    0,
    GROUND,
    WIDTH,
    6
  );

  /* road */

  ctx.strokeStyle="#38223a";
  ctx.lineWidth=2;

  const offset=
    -(worldX%70);

  for(
    let x=offset-70;
    x<WIDTH+70;
    x+=70
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      GROUND+10
    );

    ctx.lineTo(
      x+40,
      HEIGHT
    );

    ctx.stroke();

  }

  /* lights */

  for(
    let x=-(worldX%180);
    x<WIDTH;
    x+=180
  ){

    ctx.fillStyle="#f0a63c";

    ctx.globalAlpha=.45;

    ctx.fillRect(
      x+40,
      GROUND-42,
      5,
      42
    );

    ctx.fillRect(
      x+34,
      GROUND-45,
      17,
      6
    );

    ctx.globalAlpha=1;

  }

}

/* ============================================================
   COIN DRAW
============================================================ */

function drawCoins(){

  for(const coin of coins){

    if(coin.taken) continue;

    const x=
      coin.x-worldX;

    const y=
      coin.y+
      Math.sin(
        elapsed*4+coin.phase
      )*5;

    if(x<-30||x>WIDTH+30)
      continue;

    ctx.save();

    ctx.translate(
      Math.round(x),
      Math.round(y)
    );

    const scale=
      .75+
      Math.abs(
        Math.sin(
          elapsed*5+coin.phase
        )
      )*.25;

    ctx.scale(
      scale,
      1
    );

    ctx.fillStyle="#f4c85d";

    ctx.fillRect(
      -8,-12,
      16,24
    );

    ctx.fillStyle="#fff0a6";

    ctx.fillRect(
      -3,-8,
      4,16
    );

    ctx.restore();

  }

}

/* ============================================================
   PLAYER DRAW
============================================================ */

function drawPlayer(){

  const x=
    Math.round(
      player.x-worldX
    );

  const y=
    Math.round(player.y);

  ctx.save();

  if(
    player.invincible>0 &&
    Math.floor(elapsed*18)%2===0
  ){

    ctx.globalAlpha=.45;

  }

  /* shadow */

  ctx.globalAlpha*=.35;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    x+player.width/2,
    GROUND+3,
    28,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;

  /* tail */

  ctx.strokeStyle="#bd8840";

  ctx.lineWidth=8;

  ctx.lineCap="square";

  ctx.beginPath();

  const tailWave=
    Math.sin(
      elapsed*8
    )*7;

  ctx.moveTo(
    x+8,
    y+43
  );

  ctx.quadraticCurveTo(
    x-20,
    y+32+tailWave,
    x-28,
    y+55
  );

  ctx.stroke();

  /* cape */

  ctx.fillStyle="#2a4a7e";

  ctx.fillRect(
    x+5,
    y+26,
    31,
    31
  );

  /* body */

  ctx.fillStyle="#3f6fb5";

  ctx.fillRect(
    x+9,
    y+24,
    24,
    31
  );

  /* legs */

  ctx.fillStyle="#17121c";

  const step=
    Math.sin(
      player.animation
    )*3;

  ctx.fillRect(
    x+10,
    y+52,
    8,
    14+step
  );

  ctx.fillRect(
    x+23,
    y+52,
    8,
    14-step
  );

  /* head */

  ctx.fillStyle="#e8b96a";

  ctx.fillRect(
    x+6,
    y+3,
    29,
    27
  );

  /* ears */

  ctx.beginPath();

  ctx.moveTo(
    x+7,y+9
  );

  ctx.lineTo(
    x+2,y-8
  );

  ctx.lineTo(
    x+16,y+5
  );

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(
    x+32,y+9
  );

  ctx.lineTo(
    x+39,y-8
  );

  ctx.lineTo(
    x+23,y+5
  );

  ctx.fill();

  /* inner ears */

  ctx.fillStyle="#e5788a";

  ctx.fillRect(
    x+7,y+1,
    6,8
  );

  ctx.fillRect(
    x+28,y+1,
    6,8
  );

  /* eyes */

  ctx.fillStyle="#4fd6c0";

  const eyeX=
    player.facing>0
    ?x+25
    :x+10;

  ctx.fillRect(
    eyeX,
    y+13,
    5,
    6
  );

  /* scarf */

  ctx.fillStyle="#e85d75";

  ctx.fillRect(
    x+6,
    y+27,
    29,
    6
  );

  /* attack */

  if(player.attackTimer>0){

    const progress=
      1-player.attackTimer/.22;

    ctx.save();

    ctx.translate(
      x+player.width/2,
      y+33
    );

    ctx.scale(
      player.facing,
      1
    );

    ctx.strokeStyle="#f4e9c8";
    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.arc(
      20,
      0,
      50,
      -1.05+progress*.5,
      .35+progress*.5
    );

    ctx.stroke();

    ctx.strokeStyle="#f0a63c";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      20,
      0,
      55,
      -1.05+progress*.5,
      .35+progress*.5
    );

    ctx.stroke();

    ctx.restore();

  }

  ctx.restore();

}

/* ============================================================
   ENEMY DRAW
============================================================ */

function drawEnemy(enemy){

  const x=
    Math.round(
      enemy.x-worldX
    );

  const y=
    Math.round(enemy.y);

  if(
    x<-100||
    x>WIDTH+100
  )
    return;

  ctx.save();

  if(enemy.flash>0){

    ctx.globalAlpha=.5;

  }

  /* shadow */

  ctx.globalAlpha*=.3;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    x+enemy.width/2,
    GROUND+3,
    enemy.width*.55,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;

  /* body */

  ctx.fillStyle=
    enemy.type===1
    ?"#49316b"
    :"#653b65";

  ctx.fillRect(
    x+5,
    y+10,
    enemy.width-10,
    enemy.height-8
  );

  /* head */

  ctx.fillStyle=
    enemy.type===1
    ?"#8c4eaf"
    :"#a44e69";

  ctx.fillRect(
    x+3,
    y,
    enemy.width-6,
    enemy.height*.58
  );

  /* ears */

  ctx.beginPath();

  ctx.moveTo(
    x+7,y+7
  );

  ctx.lineTo(
    x+3,y-9
  );

  ctx.lineTo(
    x+17,y+5
  );

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(
    x+enemy.width-8,y+7
  );

  ctx.lineTo(
    x+enemy.width-3,y-9
  );

  ctx.lineTo(
    x+enemy.width-20,y+5
  );

  ctx.fill();

  /* eyes */

  ctx.fillStyle="#f0a63c";

  ctx.fillRect(
    x+9,
    y+14,
    5,
    5
  );

  ctx.fillRect(
    x+enemy.width-14,
    y+14,
    5,
    5
  );

  /* armor */

  if(enemy.type===1){

    ctx.fillStyle="#b993d2";

    ctx.fillRect(
      x+8,
      y+29,
      enemy.width-16,
      6
    );

  }

  /* hp */

  if(enemy.hp<enemy.maxHp){

    ctx.fillStyle="#100c16";

    ctx.fillRect(
      x,
      y-16,
      enemy.width,
      5
    );

    ctx.fillStyle="#e65e77";

    ctx.fillRect(
      x,
      y-16,
      enemy.width*
      (enemy.hp/enemy.maxHp),
      5
    );

  }

  ctx.restore();

}

/* ============================================================
   PARTICLE DRAW
============================================================ */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        Math.min(
          1,
          p.life/.7
        )
      );

    ctx.fillStyle=p.color;

    ctx.fillRect(
      Math.round(
        p.x-worldX
      ),
      Math.round(p.y),
      p.size,
      p.size
    );

  }

  ctx.globalAlpha=1;

}

/* ============================================================
   TEXT DRAW
============================================================ */

function drawFloating(){

  ctx.textAlign="center";

  ctx.font=
    "bold 15px Arial";

  for(const t of floating){

    ctx.globalAlpha=
      Math.max(
        0,
        Math.min(
          1,
          t.life/.75
        )
      );

    ctx.fillStyle=t.color;

    ctx.fillText(
      t.text,
      t.x-worldX,
      t.y
    );

  }

  ctx.globalAlpha=1;

}

/* ============================================================
   GOAL
============================================================ */

function drawGoal(){

  const x=
    STAGE_LENGTH-120-worldX;

  if(x<-100||x>WIDTH+100)
    return;

  ctx.fillStyle="#f0a63c";

  ctx.fillRect(
    x,
    GROUND-145,
    6,
    145
  );

  ctx.fillStyle="#f4e9c8";

  ctx.beginPath();

  ctx.moveTo(
    x+6,
    GROUND-140
  );

  ctx.lineTo(
    x+82,
    GROUND-120
  );

  ctx.lineTo(
    x+6,
    GROUND-98
  );

  ctx.closePath();

  ctx.fill();

  ctx.fillStyle="#f0a63c";

  ctx.font="bold 12px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    "GOAL",
    x+38,
    GROUND-160
  );

}

/* ============================================================
   DRAW
============================================================ */

function draw(){

  ctx.save();

  if(shake>0){

    const power=
      shake*30;

    ctx.translate(
      (Math.random()-.5)*power,
      (Math.random()-.5)*power
    );

    shake=
      Math.max(
        0,
        shake-1/60
      );

  }

  drawBackground();

  drawGround();

  drawCoins();

  drawGoal();

  for(const enemy of enemies){

    drawEnemy(enemy);

  }

  drawPlayer();

  drawParticles();

  drawFloating();

  ctx.restore();

}

/* ============================================================
   HUD
============================================================ */

function updateHUD(){

  document
    .getElementById("hp")
    .style.width=
      player.hp+"%";

  document
    .getElementById("score")
    .textContent=
      String(score)
      .padStart(6,"0");

  document
    .getElementById("combo")
    .textContent=
      combo>1
      ?combo+" COMBO"
      :"";

  const progress=
    Math.min(
      100,
      Math.floor(
        player.x/
        STAGE_LENGTH*
        100
      )
    );

  document
    .getElementById("progress")
    .textContent=
      "AREA 01  "+progress+"%";

}

/* ============================================================
   LOOP
============================================================ */

let lastTime=0;

function loop(now){

  if(!gameRunning)
    return;

  let dt=
    Math.min(
      (now-lastTime)/1000,
      .05
    );

  lastTime=now;

  if(!paused){

    if(hitStop>0){

      hitStop-=dt;

      dt=0;

    }

    update(dt);

  }

  draw();

  requestAnimationFrame(loop);

}

/* ============================================================
   PAUSE
============================================================ */

function togglePause(){

  if(!gameRunning)
    return;

  paused=!paused;

  document
    .getElementById("pauseScreen")
    .style.display=
      paused
      ?"flex"
      :"none";

}

/* ============================================================
   TOUCH BUTTON
============================================================ */

function bindButton(
  id,
  property
){

  const el=
    document.getElementById(id);

  const down=e=>{

    e.preventDefault();

    input[property]=true;

    el.classList.add("active");

    try{

      el.setPointerCapture(
        e.pointerId
      );

    }catch{}

  };

  const up=e=>{

    e.preventDefault();

    input[property]=false;

    el.classList.remove("active");

  };

  el.addEventListener(
    "pointerdown",
    down
  );

  el.addEventListener(
    "pointerup",
    up
  );

  el.addEventListener(
    "pointercancel",
    up
  );

  el.addEventListener(
    "pointerleave",
    up
  );

}

bindButton("left","left");
bindButton("right","right");
bindButton("jump","jump");
bindButton("attack","attack");
bindButton("dash","dash");

/* ============================================================
   KEYBOARD
============================================================ */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="ArrowLeft"||
      e.code==="KeyA"
    )
      input.left=true;

    if(
      e.code==="ArrowRight"||
      e.code==="KeyD"
    )
      input.right=true;

    if(
      e.code==="ArrowUp"||
      e.code==="KeyW"||
      e.code==="Space"
    )
      input.jump=true;

    if(
      e.code==="KeyZ"||
      e.code==="KeyJ"
    )
      input.attack=true;

    if(
      e.code==="ShiftLeft"||
      e.code==="KeyK"
    )
      input.dash=true;

    if(e.code==="Escape")
      togglePause();

  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      e.code==="ArrowLeft"||
      e.code==="KeyA"
    )
      input.left=false;

    if(
      e.code==="ArrowRight"||
      e.code==="KeyD"
    )
      input.right=false;

    if(
      e.code==="ArrowUp"||
      e.code==="KeyW"||
      e.code==="Space"
    )
      input.jump=false;

    if(
      e.code==="KeyZ"||
      e.code==="KeyJ"
    )
      input.attack=false;

    if(
      e.code==="ShiftLeft"||
      e.code==="KeyK"
    )
      input.dash=false;

  }
);

/* ============================================================
   UI
============================================================ */

document
  .getElementById("start")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      startGame();
    }
  );

document
  .getElementById("retry")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      startGame();
    }
  );

document
  .getElementById("again")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      startGame();
    }
  );

document
  .getElementById("pause")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      togglePause();
    }
  );

document
  .getElementById("resume")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      togglePause();
    }
  );

/* ============================================================
   MOBILE SAFETY
============================================================ */

document.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault()
);

/* ============================================================
   INITIAL
============================================================ */

resetGame();

draw();

</script>
