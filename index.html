<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TAILBLADE</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07060c;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #title-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, #171027 0%, #0b0912 45%, #050509 100%);
      z-index: 100;
    }

    .logo {
      margin: 0;
      color: #f4e9c8;
      font-family: Georgia, serif;
      font-size: clamp(52px, 12vw, 150px);
      letter-spacing: 0.04em;
      text-shadow:
        5px 5px 0 #38234d,
        0 0 35px rgba(150, 90, 220, 0.25);
      text-align: center;
    }

    .subtitle {
      margin-top: 12px;
      color: #9a8fb5;
      font-size: clamp(12px, 2.5vw, 28px);
      letter-spacing: 0.45em;
    }

    #start-button {
      margin-top: 70px;
      width: min(260px, 55vw);
      height: 78px;
      border: 3px solid #f0a63c;
      border-radius: 10px;
      background: rgba(20, 15, 34, 0.8);
      color: #f4e9c8;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 0.25em;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.12s;
    }

    #start-button:active {
      transform: scale(0.94);
      background: #2a1b38;
    }

    #game-screen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #07060c;
    }

    #game-screen.active {
      display: flex;
    }

    canvas {
      width: min(100vw, 177.78vh);
      height: min(56.25vw, 100vh);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #111;
    }

    #rotate-hint {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #07060c;
      color: #f4e9c8;
      font-size: 6vw;
      text-align: center;
      z-index: 200;
    }

    @media (orientation: portrait) {
      #rotate-hint {
        display: flex;
      }
    }
  </style>
</head>

<body>

  <div id="game">

    <section id="title-screen">
      <h1 class="logo">TAILBLADE</h1>
      <div class="subtitle">PIXEL ACTION GAME</div>

      <button id="start-button" type="button">
        START
      </button>
    </section>

    <section id="game-screen">
      <canvas id="game-canvas" width="320" height="180"></canvas>
    </section>

    <div id="rotate-hint">
      <p>画面を横向きにしてください</p>
    </div>

  </div>

  <script>
    "use strict";

    document.addEventListener("DOMContentLoaded", () => {

      const startButton = document.getElementById("start-button");
      const titleScreen = document.getElementById("title-screen");
      const gameScreen = document.getElementById("game-screen");
      const canvas = document.getElementById("game-canvas");

      const ctx = canvas.getContext("2d");

      let gameStarted = false;

      function startGame() {
        if (gameStarted) return;

        gameStarted = true;

        titleScreen.style.display = "none";
        gameScreen.classList.add("active");

        drawGame();

        console.log("TAILBLADE STARTED");
      }

      startButton.addEventListener("click", startGame);

      startButton.addEventListener("pointerdown", (event) => {
        event.preventDefault();
      });

      function drawGame() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景
        ctx.fillStyle = "#11101a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 空
        ctx.fillStyle = "#211733";
        ctx.fillRect(0, 0, canvas.width, 110);

        // 地面
        ctx.fillStyle = "#30243d";
        ctx.fillRect(0, 110, canvas.width, 70);

        // 地面ライン
        ctx.fillStyle = "#f0a63c";
        ctx.fillRect(0, 109, canvas.width, 2);

        // 仮プレイヤー
        ctx.fillStyle = "#e8b96a";
        ctx.fillRect(70, 90, 14, 20);

        ctx.fillStyle = "#f8e0b0";
        ctx.fillRect(73, 84, 10, 8);

        // 目
        ctx.fillStyle = "#4fd6c0";
        ctx.fillRect(79, 86, 2, 2);

        // UI
        ctx.fillStyle = "#f4e9c8";
        ctx.font = "10px Arial";
        ctx.fillText("TAILBLADE", 10, 15);

        ctx.fillStyle = "#9a8fb5";
        ctx.fillText("GAME STARTED", 10, 28);
      }

    });
  </script>

</body>
</html>
