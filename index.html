<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>TAILBLADE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Orientation overlay -->
  <div id="orientOverlay" class="overlay hidden">スマホを横向きにしてください</div>

  <!-- Title / Start -->
  <div id="titleScreen" class="overlay titleScreen">
    <div class="titleBlock">
      <h1>TAILBLADE</h1>
      <p class="subtitle">PIXEL ACTION ADVENTURE</p>
      <button id="startBtn" class="bigBtn">START</button>
    </div>
    <div class="credits">Designed for mobile — Longxing</div>
  </div>

  <!-- Canvas -->
  <div id="gameWrap">
    <canvas id="gameCanvas" aria-label="TAILBLADE game canvas"></canvas>

    <!-- UI - top bars -->
    <div id="uiTopLeft" class="uiTop left">
      <div id="hpBar" class="hp">
        <div class="hpLabel">HP</div>
        <div class="hpMeter"><div id="hpFill"></div></div>
      </div>
    </div>

    <div id="uiTopRight" class="uiTop right">
      <div class="scoreBlock">
        <div class="smallLabel">SCORE</div>
        <div id="scoreText" class="scoreNum">000000</div>
        <div class="smallLabel">COMBO</div>
        <div id="comboText" class="scoreNum">x0</div>
        <div class="smallLabel">AREA</div>
        <div id="areaText" class="scoreNum">1</div>
      </div>
    </div>

    <!-- Pause button -->
    <button id="pauseBtn" class="pauseBtn" aria-label="Pause">⏸</button>

    <!-- Bottom touch buttons -->
    <div id="touchControls" class="touchControls" role="group" aria-label="Touch controls">
      <div class="leftCluster">
        <button class="btn touchBtn" data-action="left" id="btnLeft"><span class="label">◀</span><span class="holdBar"></span></button>
        <button class="btn touchBtn" data-action="right" id="btnRight"><span class="label">▶</span><span class="holdBar"></span></button>
      </div>
      <div class="rightCluster">
        <button class="btn touchBtn" data-action="jump" id="btnJump"><span class="label">▲</span><span class="holdBar"></span></button>
        <button class="btn touchBtn" data-action="attack" id="btnAttack"><span class="label">⚔</span><span class="holdBar"></span></button>
        <button class="btn touchBtn" data-action="dash" id="btnDash"><span class="label">⤴</span><span class="holdBar"></span></button>
      </div>
    </div>

    <!-- Overlays: pause, gameover, clear -->
    <div id="pauseScreen" class="overlay hidden">
      <div class="popup">
        <h2>PAUSED</h2>
        <button id="resumeBtn" class="bigBtn">RESUME</button>
      </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <div class="popup">
        <h2>GAME OVER</h2>
        <div id="finalScore">SCORE 000000</div>
        <button id="retryBtn" class="bigBtn">RETRY</button>
      </div>
    </div>

    <div id="clearScreen" class="overlay hidden">
      <div class="popup">
        <h2>STAGE CLEAR</h2>
        <div id="clearScore">SCORE 000000</div>
        <button id="playAgainBtn" class="bigBtn">PLAY AGAIN</button>
      </div>
    </div>

    <!-- Boss HUD -->
    <div id="bossHud" class="bossHud hidden" aria-hidden="true">
      <div class="bossTitle">NIGHT GUARDIAN</div>
      <div class="bossBar"><div id="bossFill"></div></div>
    </div>

  </div>

  <script src="game.js"></script>
  <script>
    // Prevent gestures that may cause zoom/scroll
    window.addEventListener('gesturestart', e => e.preventDefault());
    window.addEventListener('touchmove', function(e){ if (e.scale && e.scale !== 1) e.preventDefault(); }, {passive:false});
    window.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
