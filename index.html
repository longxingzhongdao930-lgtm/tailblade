<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <meta name="theme-color" content="#08060d">

  <title>TAILBLADE - Pixel Action Game</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="game-root">

    <!-- GAME CANVAS -->
    <canvas
      id="game-canvas"
      width="960"
      height="540"
      aria-label="TAILBLADE game"
    ></canvas>

    <!-- START SCREEN -->
    <section id="start-screen" class="screen">

      <div class="title-wrap">
        <p class="eyebrow">PIXEL ACTION GAME</p>

        <h1>TAILBLADE</h1>

        <p class="subtitle">
          THE LAST BLADE OF THE NIGHT
        </p>
      </div>

      <button
        id="start-button"
        class="main-button"
        type="button"
      >
        START
      </button>

      <div class="controls-help">
        <span>← →</span>
        <span>MOVE</span>
        <span>↑ / SPACE</span>
        <span>JUMP</span>
        <span>Z / TAP</span>
        <span>ATTACK</span>
      </div>

      <p class="best-score">
        BEST <strong id="start-best-score">0</strong>
      </p>

    </section>


    <!-- GAME UI -->
    <section id="game-ui" hidden>

      <div class="top-bar">

        <div class="brand">
          TAILBLADE
        </div>

        <div class="score-box">
          SCORE
          <strong id="score">0</strong>
        </div>

        <div class="hp-box">
          <span>HP</span>

          <div class="hp-track">
            <div id="hp-fill"></div>
          </div>

          <strong id="hp-text">100</strong>
        </div>

      </div>

      <div id="combo" class="combo" hidden>
        <strong id="combo-number">0</strong>
        HIT COMBO
      </div>

    </section>


    <!-- TOUCH CONTROLS -->
    <section id="touch-controls" hidden>

      <div class="touch-left">

        <button
          id="left-button"
          class="touch-button"
          type="button"
          aria-label="左"
        >
          ◀
        </button>

        <button
          id="right-button"
          class="touch-button"
          type="button"
          aria-label="右"
        >
          ▶
        </button>

      </div>

      <div class="touch-right">

        <button
          id="jump-button"
          class="touch-button jump"
          type="button"
          aria-label="ジャンプ"
        >
          ↑
        </button>

        <button
          id="attack-button"
          class="touch-button attack"
          type="button"
          aria-label="攻撃"
        >
          ⚔
        </button>

      </div>

    </section>


    <!-- GAME OVER -->
    <section id="game-over-screen" class="screen" hidden>

      <div class="game-over-card">

        <p class="eyebrow">
          RUN ENDED
        </p>

        <h2>GAME OVER</h2>

        <div class="final-score">
          <span>SCORE</span>
          <strong id="final-score">0</strong>
        </div>

        <div class="new-record" id="new-record" hidden>
          NEW BEST!
        </div>

        <button
          id="restart-button"
          class="main-button"
          type="button"
        >
          RETRY
        </button>

        <button
          id="title-button"
          class="secondary-button"
          type="button"
        >
          TITLE
        </button>

      </div>

    </section>


    <!-- ROTATE MESSAGE -->
    <div id="rotate-hint" hidden>
      <div>
        <div class="rotate-icon">↻</div>
        <p>画面を横向きにしてください</p>
      </div>
    </div>

  </main>

  <script src="game.js"></script>

</body>
</html>
